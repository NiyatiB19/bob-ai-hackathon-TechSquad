submission:
  title: "SupplyGuard AI"                            # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    Supply chain disruptions caused by weather events, port strikes, and geopolitical crises can affect active shipments, overload alternative routes, leave fleet assets idle, and create risks for temperature-sensitive cargo. Supply chain operators need timely intelligence to identify affected shipments, optimize fleet utilization, recommend alternatives, and detect cold-chain temperature excursions before delivery.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    SupplyGuard AI is an AI-powered supply-chain decision support platform designed to identify disruption-affected shipments, recommend alternative routes or carriers, identify idle fleet assets for redeployment, and monitor cold-chain sensor data for temperature excursions. IBM Bob will provide a conversational AI interface for analyzing supply-chain conditions and generating prioritized operational recommendations.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Disruption-affected shipment identification"
    - "Alternative route and carrier recommendations"
    - "Idle fleet detection and redeployment recommendations"
    - "Cold-chain temperature excursion detection and severity classification"
    - "IBM Bob-powered supply-chain decision support"

  tech_stack:
    languages:
      - "JavaScript"
      - "Python"
    frameworks:
      - "React"
      - "Node.js"
      - "Express.js"
      - "Vite"
    ibm_technologies:
      - "IBM Bob"
    databases:
      - "MongoDB"
    other:
      - "HTML5"
      - "CSS3"

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    A modular, contract-first architecture that brings disruption intelligence,
    fleet utilization, and cold-chain monitoring together in one unified
    decision-support platform. We are especially proud of integrating IBM Bob
    as a conversational AI layer that can turn complex supply-chain conditions
    into prioritized, actionable operational recommendations.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    The current submission focuses on the Phase 1-3 foundation, architecture,
    core workflows, and AI decision-support framework. Some advanced production
    capabilities, such as live external logistics data integration, real-time
    IoT sensor streaming, and large-scale optimization, would require further
    development and deployment infrastructure.

